version: '3.8'

services:
  perception-service:
    image: ghcr.io/action-prediction-lab/pepper-perception:latest
    build: .
    shm_size: '2gb' # Required for PyTorch DataLoaders
    command: [ "python", "-m", "perception_service.main", "--backend", "combined" ]
    ports:
      - "5557:5557" # REP socket for on-demand requests
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
